name: 'build-test'
on: # rebuild any PRs and main branch changes
  pull_request:
  push:
    branches:
      - main
      - 'releases/*'

jobs:
  build: # make sure build/ci work properly
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: |
          npm install
      - run: |
          npm run all
  test: # make sure the action works on a clean machine without building
    strategy:
      matrix:
        os:
          - ubuntu-22.04
          - ubuntu-24.04
          - ubuntu-26.04
        version:
          - 'latest'
          - '1.5.5'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Setup apptainer
        id: setup
        with:
          apptainer-version: ${{ matrix.version }}
        uses: ./
      - name: Verify apptainer
        run: __tests__/verify-apptainer-version.sh '${{ steps.setup.outputs.apptainer-version }}'
        shell: bash        
      - name: Verify requested version
        if: matrix.version != 'latest'
        run: __tests__/verify-apptainer-version.sh '${{ matrix.version }}'
      - name: Run an apptainer container
        run: apptainer -v run docker://alpine cat /etc/os-release
